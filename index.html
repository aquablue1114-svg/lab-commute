<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연구실 출근</title>
<style>
:root{color-scheme:dark;--bg:#1c2130;--panel:rgba(18,22,32,.82);--text:#f3f4f8;--muted:#aab1c3;--accent:#ffb547}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
canvas{display:block;touch-action:none}
#hud{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);padding:10px 18px;
  border-radius:14px;text-align:center;pointer-events:none;transition:opacity .4s;backdrop-filter:blur(6px);max-width:calc(100vw - 32px);box-sizing:border-box}
#hud h1{margin:0;font-size:15px;letter-spacing:.02em}
#hud p{margin:4px 0 0;font-size:13px;color:var(--muted)}
#inset{position:fixed;top:16px;left:16px;border:2px solid rgba(255,255,255,.9);border-radius:10px;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .35s}
#inset span{position:absolute;top:6px;left:8px;font-size:11px;background:rgba(0,0,0,.55);padding:2px 7px;border-radius:6px}
#backBtn{position:fixed;top:16px;right:66px;display:none;padding:11px 22px;font-size:14px;border:0;border-radius:999px;background:#fff;color:#1c2130;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:3}
#standBtn{position:fixed;top:16px;right:66px;display:none;padding:11px 22px;font-size:14px;
  border:0;border-radius:999px;background:var(--accent);color:#2a1b00;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#soundBtn{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);
  color:var(--text);font-size:18px;cursor:pointer}
#tip{position:fixed;pointer-events:none;background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px;display:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:var(--panel);padding:16px 26px;
  border-radius:16px;font-size:18px;font-weight:700;opacity:0;transition:all .35s;pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.badge{position:fixed;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:11px;
  background:#fff;color:#222;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
  pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.badge.target{background:var(--accent)}
.badge.me{background:#4c7dff;color:#fff}
#dialog{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--panel);padding:18px 20px;border-radius:16px;
  opacity:0;pointer-events:none;transition:all .35s;min-width:260px;backdrop-filter:blur(6px)}
#dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#dialog .q{font-size:18px;font-weight:800;margin-bottom:6px;text-align:center}
#dialog button{display:block;width:100%;margin-top:8px;padding:11px 16px;border:0;border-radius:10px;font-size:15px;font-weight:700;
  cursor:pointer;background:#2d3446;color:var(--text);text-align:left}
#dialog button:hover{background:var(--accent);color:#2a1b00}
#bubble{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#222;padding:7px 12px;border-radius:12px;font-size:14px;
  font-weight:700;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#bubble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
#zzz{position:fixed;pointer-events:none;font-weight:900;color:#cfe0ff;display:none}
#zzz span{position:absolute;animation:zz 2.4s infinite;opacity:0}
#zzz span:nth-child(2){font-size:22px;animation-delay:.8s}#zzz span:nth-child(3){font-size:28px;animation-delay:1.6s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(30px,-60px)}}
#fade{position:fixed;inset:0;background:#000;color:#fff;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;
  align-items:center;justify-content:center;font-size:22px;font-weight:700;z-index:4}
#rewake{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:none;padding:12px 22px;border:0;border-radius:999px;
  background:var(--accent);color:#2a1b00;font-weight:800;font-size:15px;cursor:pointer}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,12,20,.35);
  z-index:5;text-align:center}
#title h2{font-size:34px;margin:0 0 10px}#title p{color:var(--muted);margin:0;font-size:15px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
#title .card{background:var(--panel);padding:26px 24px 18px;border-radius:18px;width:min(340px,calc(100vw - 32px));box-sizing:border-box;
  backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
#title p.sub{animation:none;margin:0}
#title input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #3a4258;background:#151a26;color:var(--text);
  font-size:16px;margin:14px 0 12px;outline:none}
#title input:focus{border-color:var(--accent)}
.look{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;text-align:left}
#lookChips{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.75);display:inline-block}
.lookTxt{margin-left:3px}
#rerollBtn{border:0;border-radius:999px;padding:7px 12px;background:#2d3446;color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap}
#enterBtn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#2a1b00;font-weight:800;font-size:16px;cursor:pointer}
#title p#online{animation:none;margin-top:10px;font-size:12px;min-height:14px}
.tag{position:fixed;transform:translate(-50%,-100%);background:rgba(20,24,34,.85);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;
  border-radius:9px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.tag.me{background:#4c7dff}
.badge.taken{background:#9aa3b5;color:#333}
#who{position:fixed;bottom:16px;left:16px;background:var(--panel);border-radius:12px;padding:10px 12px;font-size:12px;min-width:150px;
  max-width:220px;pointer-events:none;display:none;backdrop-filter:blur(6px)}
.whoHead{font-weight:800;margin-bottom:6px}
.whoRow{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.whoRow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.whoRow span{color:var(--muted);white-space:nowrap}
.whoRow.me b{color:#8fb0ff}
@media (max-width:700px){#who{bottom:auto;left:auto;top:66px;right:16px}}
</style>
</head>
<body>
<div id="hud"><h1>🎄 연구실 출근</h1><p id="hint">출근할 자리(의자)를 클릭하세요</p></div>
<div id="inset"><span>연구실 전체</span></div>
<button id="standBtn">일어나기 (Esc)</button>
<button id="backBtn">← 돌아가기 (Esc)</button>
<button id="soundBtn" title="소리 켜기/끄기">🔊</button>
<div id="tip"></div>
<div id="toast"></div>
<div id="dialog"><div class="q">Q. 출근할까요?</div><button data-a="go">1) 출근하자</button><button data-a="no">2) 안할랭..</button></div>
<div id="bubble"></div>
<div id="zzz"><span>Z</span><span>z</span><span>Z</span></div>
<button id="rewake">☀️ 다시 일어나기</button>
<div id="fade"></div>
<div id="title"><div class="card"><h2>🎄 연구실 출근</h2><p class="sub">이름을 쓰고 입장하세요. 같은 링크로 들어온 사람들과 함께 있어요.</p><input id="nameInput" maxlength="12" placeholder="이름 (예: 김연구)" autocomplete="off"><div class="look"><div id="lookChips"></div><button id="rerollBtn" type="button">🎲 다른 모습</button></div><button id="enterBtn" type="button">입장하기</button><p id="online"></p></div></div>
<div id="who"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="firebase-config.js"></script>
<script>
// ================== 기본 설정 ==================
const V3 = THREE.Vector3;
const R = 5, WALL_H = 2.8, WALL_T = 0.15, CUT_H = 1.1;   // 방 반경(10x10m), 벽 높이, 문쪽 벽 컷어웨이 높이
const LAYER_HEAD = 1, LAYER_FP_ONLY = 2;                  // 1: 내 머리(1인칭에서 숨김), 2: 1인칭에서만 보임

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c2130);

const overviewCam = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
overviewCam.layers.enable(LAYER_HEAD);
const fpCam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 100);
fpCam.layers.enable(LAYER_HEAD);
let mainCam = overviewCam;
function fitOverview() {
  const a = innerWidth / innerHeight;
  const k = Math.min(2.3, Math.max(1, 1.35 / a));
  overviewCam.position.set(0, 13 * k, 9.5 * k);
  overviewCam.lookAt(0, 0, 0.7);
}
fitOverview();

// 조명
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.7));
const sun = new THREE.DirectionalLight(0xfff1dd, 0.8);
sun.position.set(-3, 9, -7);   // 창문 쪽에서 들어오는 빛
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
sun.shadow.bias = -0.0005;
scene.add(sun);
const roomLight = new THREE.PointLight(0xfff4e0, 0.35, 14);
roomLight.position.set(0, 2.6, 0);
scene.add(roomLight);

// 헬퍼
const mat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .75, metalness: 0 }, o));
function box(w, h, d, m, x, y, z, p) {
  const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; (p || scene).add(me); return me;
}
function cyl(rt, rb, h, m, x, y, z, p, seg = 16) {
  const me = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; (p || scene).add(me); return me;
}
function sphere(r, m, x, y, z, p) {
  const me = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m);
  me.position.set(x, y, z); me.castShadow = true; (p || scene).add(me); return me;
}
const setLayer = (o, l) => o.traverse(c => c.layers.set(l));
const yawOf = (x, z) => Math.atan2(x, z);
const wrapA = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const lerpA = (a, b, t) => a + wrapA(b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
}

// ================== 바닥 / 벽 ==================
const woodTex = canvasTex(512, 512, (g, w, h) => {
  for (let r = 0; r < 8; r++) {
    let x = -Math.random() * 200;
    while (x < w) {
      const pw = 170 + Math.random() * 150;
      g.fillStyle = `hsl(30,${30 + Math.random() * 8}%,${60 + Math.random() * 8}%)`;
      g.fillRect(x, r * 64, pw, 64);
      g.strokeStyle = 'rgba(80,50,30,.35)'; g.lineWidth = 2; g.strokeRect(x, r * 64, pw, 64);
      x += pw;
    }
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(2.5, 2.5);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(2 * R, 2 * R), mat(0xffffff, { map: woodTex, roughness: .85 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const hall = box(3.2, 0.02, 2.1, mat(0x9aa0ab), 0, -0.01, R + WALL_T + 1.05); // 문 밖 복도
const doormat = box(1.0, 0.012, 0.6, mat(0x5a4a3a), 0, 0.006, R - 0.45);
doormat.castShadow = false;

const wallM = mat(0xeeeae2), cutM = mat(0x7d8392);
box(2 * R + 2 * WALL_T, WALL_H, WALL_T, wallM, 0, WALL_H / 2, -R - WALL_T / 2);               // 안쪽(먼) 벽
box(WALL_T, WALL_H, 2 * R, wallM, R + WALL_T / 2, WALL_H / 2, 0);                               // 오른쪽 벽
box(WALL_T, WALL_H, 2 * R, wallM, -R - WALL_T / 2, WALL_H / 2, 0);                              // 왼쪽 벽
// 문쪽 벽: 전체 화면에서는 낮게 잘라서 보여주고(컷어웨이), 1인칭에서는 위쪽까지 보이게
const DOOR_W = 1.2, segW = R + WALL_T - DOOR_W / 2, segX = DOOR_W / 2 + segW / 2;
[-1, 1].forEach(s => {
  box(segW, CUT_H, WALL_T, wallM, s * segX, CUT_H / 2, R + WALL_T / 2);
  box(segW, 0.03, WALL_T + 0.01, cutM, s * segX, CUT_H + 0.015, R + WALL_T / 2).castShadow = false;
  setLayer(box(segW, WALL_H - CUT_H, WALL_T, wallM, s * segX, CUT_H + (WALL_H - CUT_H) / 2, R + WALL_T / 2), LAYER_FP_ONLY);
});
setLayer(box(DOOR_W, WALL_H - 2.1, WALL_T, wallM, 0, 2.1 + (WALL_H - 2.1) / 2, R + WALL_T / 2), LAYER_FP_ONLY);
// 열린 문짝 (밖으로 열림)
const doorM = mat(0x9b6b43);
box(0.05, CUT_H, 0.9, doorM, DOOR_W / 2 - 0.03, CUT_H / 2, R + WALL_T + 0.45);
setLayer(box(0.05, 2.1 - CUT_H, 0.9, doorM, DOOR_W / 2 - 0.03, CUT_H + (2.1 - CUT_H) / 2, R + WALL_T + 0.45), LAYER_FP_ONLY);
// 천장 (1인칭 전용)
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(2 * R, 2 * R), mat(0xf4f2ee));
ceil.rotation.x = Math.PI / 2; ceil.position.y = WALL_H; ceil.layers.set(LAYER_FP_ONLY); scene.add(ceil);

// ================== 장애물 / 길찾기 그리드 ==================
const obstacles = [];
const addObs = (cx, cz, hx, hz) => obstacles.push({ x0: cx - hx, x1: cx + hx, z0: cz - hz, z1: cz + hz });
addObs(DOOR_W / 2 - 0.03, R + WALL_T + 0.45, 0.04, 0.45);

// ================== 벽 장식 ==================
const bookCols = [0xc0392b, 0x2e86de, 0xf1c40f, 0x27ae60, 0x8e44ad, 0xe67e22, 0x34495e];
// 책장 (로컬 +z = 앞면). 칸막이용으로도 사용
function bookshelf(w, h, d) {
  const g = new THREE.Group(), fm = mat(0x8a6240);
  box(w, 0.03, d, fm, 0, h - 0.015, 0, g); box(w, 0.03, d, fm, 0, 0.015, 0, g);
  [-1, 1].forEach(s => box(0.03, h, d, fm, s * (w / 2 - 0.015), h / 2, 0, g));
  box(w, h, 0.02, fm, 0, h / 2, -d / 2 + 0.01, g);
  const rows = Math.floor(h / 0.4);
  for (let r = 0; r < rows; r++) {
    const y0 = 0.03 + r * (h - 0.06) / rows;
    if (r) box(w - 0.04, 0.02, d - 0.02, fm, 0, y0, 0, g);
    let x = -w / 2 + 0.04;
    while (x < w / 2 - 0.1) {
      const bw = 0.04 + Math.random() * 0.05, bh = 0.2 + Math.random() * 0.1;
      if (Math.random() < 0.88) box(bw, bh, d * 0.7, mat(bookCols[(Math.random() * 7) | 0]), x + bw / 2, y0 + 0.01 + bh / 2, 0.02, g).castShadow = false;
      x += bw + 0.006;
    }
  }
  return g;
}
// 큰 창문 (문 맞은편 벽)
const skyTex = canvasTex(1024, 300, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#6fb4ff'); gr.addColorStop(1, '#dcefff');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,.9)';
  [[140, 60], [520, 40], [830, 80]].forEach(([x, y]) => { for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(x + k * 36, y + (k % 2) * 8, 44, 20, 0, 0, Math.PI * 2); g.fill(); } });
  let x = 0;
  while (x < w) {
    const bw = 50 + Math.random() * 90, bh = 60 + Math.random() * 130;
    g.fillStyle = `hsl(215,${12 + Math.random() * 10}%,${55 + Math.random() * 15}%)`; g.fillRect(x, h - bh, bw, bh);
    g.fillStyle = 'rgba(255,255,255,.35)';
    for (let yy = h - bh + 10; yy < h - 8; yy += 18) for (let xx = x + 8; xx < x + bw - 10; xx += 16) g.fillRect(xx, yy, 7, 9);
    x += bw + 4;
  }
  g.fillStyle = '#5c9a55'; for (let k = 0; k < w; k += 30) { g.beginPath(); g.arc(k + Math.random() * 10, h, 24 + Math.random() * 14, 0, Math.PI * 2); g.fill(); }
});
const WIN_W = 5.4, WIN_H = 1.5, WIN_Y = 1.82, winFrameM = mat(0xf6f6f6);
const sky = new THREE.Mesh(new THREE.PlaneGeometry(WIN_W, WIN_H), new THREE.MeshBasicMaterial({ map: skyTex }));
sky.position.set(0, WIN_Y, -R + 0.02); scene.add(sky);
box(WIN_W + 0.12, 0.06, 0.08, winFrameM, 0, WIN_Y + WIN_H / 2 + 0.03, -R + 0.04);
box(WIN_W + 0.2, 0.05, 0.14, winFrameM, 0, WIN_Y - WIN_H / 2 - 0.02, -R + 0.07);
for (let k = 0; k <= 4; k++) box(0.06, WIN_H, 0.08, winFrameM, -WIN_W / 2 + k * WIN_W / 4, WIN_Y, -R + 0.04);
// 화이트보드 (문 오른쪽 벽, 문 가까이)
const wbTex = canvasTex(1024, 480, (g, w, h) => {
  g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, w, h);
  g.font = 'bold 46px "Apple SD Gothic Neo", sans-serif'; g.fillStyle = '#1f4fbf'; g.fillText('이번 주 연구실 일정', 50, 80);
  g.font = '36px "Apple SD Gothic Neo", sans-serif'; g.fillStyle = '#333';
  ['• 월 10:00  주간 랩미팅', '• 수 14:00  저널 클럽', '• 금 18:00  서버 점검 🛠'].forEach((s, i) => g.fillText(s, 60, 160 + i * 62));
  g.fillStyle = '#d33'; g.font = 'bold 42px "Apple SD Gothic Neo", sans-serif'; g.fillText('논문 마감 D-14 !!', 600, 400);
  g.strokeStyle = '#2a8a3a'; g.lineWidth = 5; g.beginPath(); g.moveTo(620, 160); g.lineTo(700, 260); g.lineTo(780, 200); g.lineTo(880, 300); g.stroke();
});
const wbG = new THREE.Group(); wbG.position.set(R - 0.03, 1.5, 2.3); wbG.rotation.y = -Math.PI / 2; scene.add(wbG);
box(2.4, 1.2, 0.05, mat(0xa0a6b0), 0, 0, 0, wbG);
const wb = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 1.1), new THREE.MeshStandardMaterial({ map: wbTex, roughness: .4 }));
wb.position.z = 0.03; wbG.add(wb);
// 시계 (현재 시각) — 화이트보드 위
const clock = new THREE.Group(); clock.position.set(R - 0.05, 2.45, 2.3); clock.rotation.y = -Math.PI / 2; scene.add(clock);
const face = cyl(0.18, 0.18, 0.04, mat(0xffffff), 0, 0, 0, clock, 32); face.rotation.x = Math.PI / 2;

// ================== 🎵 배경음: 징글벨 (퍼블릭 도메인, Web Audio로 직접 연주) ==================
const MIDI = { G4: 67, A4: 69, B4: 71, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79, A5: 81 };
const VERSE = 'G4 1,E5 1,D5 1,C5 1,G4 3,G4 .5,G4 .5,G4 1,E5 1,D5 1,C5 1,A4 4,A4 1,F5 1,E5 1,D5 1,B4 4,G5 1,G5 1,F5 1,D5 1,E5 4,' +
  'G4 1,E5 1,D5 1,C5 1,G4 4,G4 1,E5 1,D5 1,C5 1,A4 4,A4 1,F5 1,E5 1,D5 1,G5 1,G5 1,G5 1,G5 1,A5 1,G5 1,F5 1,D5 1,C5 4';
const CHORUS_A = 'E5 1,E5 1,E5 2,E5 1,E5 1,E5 2,E5 1,G5 1,C5 1.5,D5 .5,E5 4,F5 1,F5 1,F5 1.5,F5 .5,F5 1,E5 1,E5 1,E5 .5,E5 .5,';
const CHORUS = CHORUS_A + 'E5 1,D5 1,D5 1,E5 1,D5 2,G5 2,' + CHORUS_A + 'G5 1,G5 1,F5 1,D5 1,C5 4';
const CHORDS = 'C C C F F G G C C C C F F G G C C C C C F C G G C C C C F C G C'.split(' ');
const ROOT = { C: 48, F: 41, G: 43 };
const BEAT = 60 / 160, music = [];
let beatAt = 0;
(VERSE + ',' + CHORUS).split(',').forEach(tok => { const [n, d] = tok.trim().split(' '); music.push({ beat: beatAt, kind: 'mel', midi: MIDI[n], dur: +d }); beatAt += +d; });
const TOTAL_BEATS = beatAt;
CHORDS.forEach((c, bar) => {
  music.push({ beat: bar * 4, kind: 'bass', midi: ROOT[c], dur: 2 }, { beat: bar * 4 + 2, kind: 'bass', midi: ROOT[c] + 7, dur: 2 });
  for (let b = 0; b < 4; b++) music.push({ beat: bar * 4 + b, kind: 'bell', accent: b % 2 === 1 }, { beat: bar * 4 + b + 0.5, kind: 'bell', accent: false });
});
music.sort((a, b) => a.beat - b.beat);
let musicGain = null, musicIdx = 0, loopStart = 0, bellBuf = null;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function playEv(ev, at) {
  if (ev.kind === 'mel') {
    const g = actx.createGain(), len = Math.min(1.2, ev.dur * BEAT + 0.3);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.11, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    g.connect(musicGain);
    [[1, 1], [2, 0.35], [3.01, 0.12]].forEach(([mul, amp]) => {        // 오르골/벨 같은 소리
      const o = actx.createOscillator(), og = actx.createGain(); o.type = 'sine'; o.frequency.value = hz(ev.midi) * mul; og.gain.value = amp;
      o.connect(og).connect(g); o.start(at); o.stop(at + len + 0.05);
    });
  } else if (ev.kind === 'bass') {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = hz(ev.midi);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.09, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + ev.dur * BEAT);
    o.connect(g).connect(musicGain); o.start(at); o.stop(at + ev.dur * BEAT + 0.05);
  } else {                                                              // 썰매 방울
    const n = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
    n.buffer = bellBuf; hp.type = 'highpass'; hp.frequency.value = 6500; g.gain.value = ev.accent ? 0.05 : 0.022;
    n.connect(hp).connect(g).connect(musicGain); n.start(at);
  }
}
function scheduleMusic() {
  if (!actx || !musicGain) return;
  const now = actx.currentTime, ahead = now + 0.4;
  for (;;) {
    const ev = music[musicIdx], at = loopStart + ev.beat * BEAT;
    if (at > ahead) break;
    if (at >= now - 0.02) playEv(ev, Math.max(at, now));
    if (++musicIdx >= music.length) { musicIdx = 0; loopStart += TOTAL_BEATS * BEAT; }
  }
}
function startMusic() {
  if (!actx || musicGain) return;
  musicGain = actx.createGain(); musicGain.gain.value = soundOn ? 0.8 : 0; musicGain.connect(actx.destination);
  bellBuf = actx.createBuffer(1, actx.sampleRate * 0.12, actx.sampleRate);
  const d = bellBuf.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 4);
  loopStart = actx.currentTime + 0.15; musicIdx = 0;
  setInterval(scheduleMusic, 100);
}

    tween(0.4, e => { lid.rotation.x = from + (to - from) * e; }); bleep(open ? 300 : 500, 0, 0.08, 'square', 0.04);
    eggFound('laptop', open ? '💻 탁! 노트북을 덮었어요' : '💻 노트북을 열었어요');
  } else if (id === 'window') {
    if (sleighT < 0) { sleighT = 0; [1320, 1320, 1320, 1568].forEach((f, i) => bleep(f, i * 0.18, 0.12, 'triangle', 0.06)); }
    eggFound('window', '🎅 Ho Ho Ho! 산타 썰매가 지나가요');
  } else if (id === 'bigsnow') {
    if (bigSnowT < 0) bigSnowT = 0; [523, 659, 784].forEach((f, i) => bleep(f, i * 0.12, 0.18, 'triangle', 0.06));
    eggFound('bigsnow', '⛄ 메리 크리스마스! 나는 연구실 지킴이 큰 눈사람이야');
  } else if (id === 'me') {
    if (state === 'idle' && meJumpT < 0) { meJumpT = 0; bleep(440, 0, 0.1); bleep(880, 0.08, 0.15); eggFound('me', '🙋 나야 나!'); }
  } else if (id === 'monitor') {
    drawErr(ERR[errIdx++ % ERR.length]); bleep(220, 0, 0.2, 'sawtooth', 0.04); eggFound('monitor', '💻 으악, 코드에서 에러가 났어요');
  }
}
function eggUpdate(dt, t) {
  if (bigSnowT >= 0) { bigSnowT += dt; const r = Math.min(1, bigSnowT / 2); snowArms.forEach((a, i) => { a.rotation.z = (i ? 1 : -1) * -1.0 + (i ? -1 : 1) * Math.sin(r * Math.PI * 6) * 0.6 * (1 - r) * (i ? 1 : 0) + (i ? 0 : 0); }); bigSnowman.position.y = Math.abs(Math.sin(r * Math.PI * 4)) * 0.08 * (1 - r); if (r >= 1) bigSnowT = -1; }
  // 트리 반짝
  if (treeFlash > 0) { treeFlash -= dt; xmasLightMats.forEach((m, i) => { m.emissiveIntensity = 1.6 * (Math.sin(t * 25 + i) > 0 ? 1 : 0.1); }); treeStar.rotation.y += dt * 12; }
  // 실내 눈
  if (indoorSnowT > 0) {
    indoorSnowT -= dt; inSnow.material.opacity = Math.min(0.9, indoorSnowT / 2);
    for (let k = 0; k < IN_N; k++) { const i = k * 3; inArr[i + 1] -= dt * (0.3 + (k % 7) * 0.05); inArr[i] += Math.sin(t + k) * dt * 0.1; if (inArr[i + 1] < 0) inArr[i + 1] = 2.8; }
    inGeo.attributes.position.needsUpdate = true;
    if (indoorSnowT <= 0) inSnow.visible = false;
  }
  // 눈사람
  if (snowmanJumpT > 0) { snowmanJumpT = Math.max(0, snowmanJumpT - dt); const r = 1 - snowmanJumpT / 0.9; snowman.position.y = 0.775 + Math.sin(Math.PI * r) * 0.25; snowman.rotation.y = r * Math.PI * 2; }
  // 시계
  if (clockSpin > 0) { clockSpin += dt * 4; if (clockSpin >= Math.PI * 2) clockSpin = 0; }
  // 썰매 (창문 안쪽에서만 보이게)
  if (sleighT >= 0) {
    sleighT += dt; const r = sleighT / 4, x = -WIN_W / 2 - 0.3 + r * (WIN_W + 0.6);
    sleigh.position.set(x, WIN_Y + 0.2 + Math.sin(r * Math.PI * 3) * 0.15, -R + 0.05);
    sleigh.visible = Math.abs(x) < WIN_W / 2 - 0.2;
    if (r >= 1) { sleighT = -1; sleigh.visible = false; }
  }
  // 나 점프 + 한 바퀴
  if (meJumpT >= 0) { meJumpT += dt; const r = Math.min(1, meJumpT / 0.7); me.jumpY = Math.sin(Math.PI * r) * 0.45; me.spin = r * Math.PI * 2; if (r >= 1) { meJumpT = -1; me.jumpY = 0; me.spin = 0; } }
  // 디스코
  if (discoT > 0) {
    discoT -= dt; const on = discoT > 0;
    discoLights.forEach((l, i) => { l.intensity = on ? 1.4 * (0.5 + 0.5 * Math.sin(t * 6 + i * 2)) : 0; l.position.set(Math.cos(t * 1.5 + i * 2.1) * 2.5, 2.4, Math.sin(t * 1.5 + i * 2.1) * 2.5); });
    if (state === 'idle' && phase === 'lab') me.armUp = on ? 0.5 + 0.5 * Math.sin(t * 8) : 0;
    if (!on) me.armUp = 0;
  }
}

// ================== 🔍 사물 클릭 → 그 사물이 보이는 시점 ==================
const FOCUS = {
  board: [[R - 2.7, 1.65, 2.3], [R, 1.5, 2.3]],
  clock: [[R - 1.7, 2.05, 2.3], [R, 2.4, 2.3]],
  tree: [[1.2, 1.9, 1.8], [3.6, 1.1, 4.1]],
  snowman: [[-0.3, 1.3, 2.7], [-0.6, 0.92, TZ + 1.3]],
  bigsnow: [[0.85, 1.6, 1.3], [BIG_SNOW.x, 0.95, BIG_SNOW.z]],
  window: [[0, 1.75, -2.3], [0, 1.8, -R]],
};
const NO_FOCUS = new Set(['me', 'monitor']);
let focusId = null, focusBusy = false;
const backBtn = $('backBtn');
function canFocus() { return (state === 'idle' || state === 'seated') && !cupBusy && !focusBusy; }
async function focusOn(id, obj) {
  if (focusId === id || !canFocus()) return;
  focusBusy = true;
  let pos, look;
  if (FOCUS[id]) { pos = new V3(...FOCUS[id][0]); look = new V3(...FOCUS[id][1]); }
  else { look = obj.getWorldPosition(new V3()); look.y += 0.1; pos = look.clone().add(new V3(0.5, 0.6, 0.8)); }
  dummyCam.position.copy(pos); dummyCam.lookAt(look);
  const asp = innerWidth / innerHeight, fov1 = asp < 1.2 ? Math.min(85, 2 * Math.atan(Math.tan(27.5 * Math.PI / 180) * 1.2 / asp) * 180 / Math.PI) : 55;   // 세로 화면이면 시야를 넓혀서 잘리지 않게
  const p0 = mainCam.position.clone(), q0 = mainCam.quaternion.clone(), f0 = mainCam.fov, q1 = dummyCam.quaternion.clone();
  if (mainCam !== fpCam) { fpCam.position.copy(p0); fpCam.quaternion.copy(q0); fpCam.fov = f0; mainCam = fpCam; }
  fpCam.layers.enable(LAYER_HEAD); fpCam.layers.enable(LAYER_FP_ONLY);
  focusId = id; standBtn.style.display = 'none'; backBtn.style.display = 'block';
  hint.textContent = '🔍 가까이 보는 중 · 사물을 눌러 보세요'; $('hud').style.opacity = 1;
  await tween(1.0, e => {
    fpCam.position.lerpVectors(p0, pos, e); fpCam.position.y += Math.sin(Math.PI * e) * 0.4;
    fpCam.quaternion.copy(q0).slerp(q1, e); fpCam.fov = f0 + (fov1 - f0) * e; fpCam.updateProjectionMatrix();
  });
  focusBusy = false;
}
async function unfocus() {
  if (!focusId || focusBusy) return;
  focusBusy = true; backBtn.style.display = 'none';
  const seated = state === 'seated';
  const p0 = fpCam.position.clone(), q0 = fpCam.quaternion.clone(), f0 = fpCam.fov;
  let p1, q1, f1;
  if (seated) { const fp = fpPose(current); p1 = fp.pos; q1 = fp.quat; f1 = 70; }
  else { p1 = overviewCam.position.clone(); q1 = overviewCam.quaternion.clone(); f1 = overviewCam.fov; fpCam.layers.disable(LAYER_FP_ONLY); }
  await tween(1.0, e => {
    fpCam.position.lerpVectors(p0, p1, e); fpCam.position.y += Math.sin(Math.PI * e) * 0.4;
    fpCam.quaternion.copy(q0).slerp(q1, e); fpCam.fov = f0 + (f1 - f0) * e; fpCam.updateProjectionMatrix();
  });
  if (seated) { fpCam.layers.disable(LAYER_HEAD); lookAmt = 0; standBtn.style.display = 'block'; hint.textContent = `${current.i + 1}번 자리 착석 · 마우스로 살짝 둘러볼 수 있어요`; }
  else { mainCam = overviewCam; hint.textContent = '출근할 자리(의자)를 클릭하세요'; }
  focusId = null; focusBusy = false;
}
backBtn.onclick = e => { e.stopPropagation(); unfocus(); };

// ================== 루프 ==================
const tmp = new V3();
function project(v, el) {
  tmp.copy(v).project(overviewCam);
  if (tmp.z > 1) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  el.style.left = (tmp.x * .5 + .5) * innerWidth + 'px'; el.style.top = (-tmp.y * .5 + .5) * innerHeight + 'px';
}
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now; const t = now / 1000;
  updateTweens(dt);
  updatePerson(dt, t);
  xmasUpdate(dt, t); eggUpdate(dt, t);
  updateRemotes(dt, t); netTick(dt);
  if (phase !== 'lab') {   // 인트로 (집 / 복도)
    updateIntro(dt, t);
    renderer.setScissorTest(false); renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.render(IS, introCam);
    seats.forEach(s => s.badge.style.display = 'none'); meBadge.style.display = 'none';
    requestAnimationFrame(frame); return;
  }

  // 착석 중 마우스로 살짝 둘러보기
  if (state === 'seated' && !focusId) {
    lookAmt = Math.min(1, lookAmt + dt * 1.5);
    lookYaw += (-mouseN.x * 0.5 - lookYaw) * (1 - Math.exp(-dt * 5));
    lookPitch += (mouseN.y * 0.25 - lookPitch) * (1 - Math.exp(-dt * 5));
    const eul = new THREE.Euler().setFromQuaternion(seatedQuat, 'YXZ');
    eul.y += lookYaw * lookAmt; eul.x += lookPitch * lookAmt + Math.sin(t * 1.6) * 0.004;
    fpCam.quaternion.setFromEuler(eul);
    clockT += dt; if (clockT > 1) { clockT = 0; drawScreen(current); }
  }
  // 시계 바늘
  const d = new Date(), mins = d.getMinutes() + d.getSeconds() / 60;
  minHand.rotation.z = -mins / 60 * Math.PI * 2 - clockSpin * 12; hourHand.rotation.z = -((d.getHours() % 12) + mins / 60) / 12 * Math.PI * 2 - clockSpin;

  // 메인 화면
  const W = innerWidth, H = innerHeight;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H);
  overviewCam.aspect = W / H; overviewCam.updateProjectionMatrix();
  renderer.render(scene, mainCam);
  // 좌상단 작은 화면 (연구실 전체)
  if (insetOn) {
    const ir = insetRect, y = H - ir.y - ir.h;
    renderer.setScissorTest(true); renderer.setViewport(ir.x, y, ir.w, ir.h); renderer.setScissor(ir.x, y, ir.w, ir.h);
    overviewCam.aspect = ir.w / ir.h; overviewCam.updateProjectionMatrix();
    renderer.render(scene, overviewCam);
    renderer.setScissorTest(false);
    overviewCam.aspect = W / H; overviewCam.updateProjectionMatrix();
  }
  // 좌석 번호 배지 (전체 화면 모드에서만)
  const showBadges = mainCam === overviewCam;
  seats.forEach(s => {
    if (!showBadges) { s.badge.style.display = 'none'; return; }
    project(tmp.set(s.deskC.x, 1.55, s.deskC.z).clone(), s.badge);
    s.badge.classList.toggle('target', s === targetSeat); s.badge.classList.toggle('taken', !!seatTaker(s.i));
  });
  if (showBadges) project(me.root.position.clone().setY(me.root.position.y + 1.82), meBadge); else meBadge.style.display = 'none';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
